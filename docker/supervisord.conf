[supervisord]
nodaemon=true
user=root
logfile=/var/log/gwent/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ---------------------------------------------------------------- mysqld ----
[program:mysqld]
command=/usr/sbin/mysqld --user=mysql --datadir=/var/lib/mysql
        --socket=/run/mysqld/mysqld.sock --pid-file=/run/mysqld/mysqld.pid
        --bind-address=127.0.0.1 --port=3306
priority=10
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/gwent/mysqld.log
stderr_logfile=/var/log/gwent/mysqld.err
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB

; ------------------------------------------------- Spring Boot 卡组服务 ----
[program:gwent-service]
command=/usr/local/bin/wait-for-mysql.sh
priority=20
autostart=true
autorestart=true
startsecs=15
startretries=20
stopwaitsecs=20
stdout_logfile=/var/log/gwent/backend.log
stderr_logfile=/var/log/gwent/backend.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=GWENT_DB_NAME="%(ENV_GWENT_DB_NAME)s",GWENT_DB_USER="%(ENV_GWENT_DB_USER)s",GWENT_DB_PASS="%(ENV_GWENT_DB_PASS)s"

; ----------------------------------------------------------------- nginx ----
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=/var/log/gwent/nginx.log
stderr_logfile=/var/log/gwent/nginx.err
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB