# GwentMirror 前端静态站点 + 后端反代
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 100m;

    # vue 打包产物（js/css 与卡牌素材都放在 /src/assets/ 下）
    location /src/assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 后端 API：/gmapi/deck/api/getDecks -> http://127.0.0.1:8081/deck/api/getDecks
    location /gmapi/ {
        proxy_pass         http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # 官网数据源（前端 src/api/carddata.ts 使用；容器离线时该路由不可用，
    # 但卡牌数据已内置到 src/assets/allCard.json，不影响页面渲染）
    location /api-pg/ {
        resolver 223.5.5.5 119.29.29.29 valid=60s ipv6=off;
        set $pg_host www.playgwent.com;
        proxy_pass https://$pg_host/;
        proxy_ssl_server_name on;
        proxy_set_header Host www.playgwent.com;
        proxy_connect_timeout 8s;
        proxy_read_timeout 30s;
    }

    # 容器健康检查
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}